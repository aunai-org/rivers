<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>River Atlas phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;color:#fff}
.glass{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05)),rgba(4,32,46,.38);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 14px 34px rgba(1,16,24,.4)}
.glass::before{content:"";position:absolute;top:-60%;left:-40%;width:50%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(12deg);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.38}
.b1{width:260px;height:260px;left:-80px;top:40px;background:#3dd6d0;animation:drift1 14s ease-in-out infinite}
.b2{width:240px;height:240px;right:-90px;top:300px;background:#4f9dff;animation:drift2 18s ease-in-out infinite}
.b3{width:220px;height:220px;left:40px;bottom:-60px;background:#9af2c8;animation:drift1 16s ease-in-out infinite reverse}
.wave{position:absolute;left:0;width:780px;height:90px;animation:waveMove 9s linear infinite}
.wave.w2{animation-duration:14s;animation-direction:reverse}
.flow{stroke-dasharray:1 13;animation:flowDash 1.4s linear infinite}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite;fill:none;stroke:#fff}
.ripple.r2{animation-delay:1.5s}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7ff0e6,#8fc2ff);animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}
.floaty{animation:floaty 6s ease-in-out infinite}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
button{font:inherit;color:inherit}
@keyframes sheen{0%,60%{transform:translateX(-120%) rotate(12deg)}100%{transform:translateX(420%) rotate(12deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-30px) scale(1.2)}}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-390px)}}
@keyframes flowDash{to{stroke-dashoffset:-14}}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes grow{from{width:0}}
@keyframes shimmer{0%,40%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:linear-gradient(172deg,#04202d 0%,#06475c 48%,#0b6f78 100%)">

<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<svg class="wave" style="bottom:0;opacity:.35" viewBox="0 0 780 90" aria-hidden="true"><path d="M0 40 q48.75 -34 97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 V90 H0 Z" fill="#7ff0e6"/></svg>
<svg class="wave w2" style="bottom:0;opacity:.28" viewBox="0 0 780 90" aria-hidden="true"><path d="M0 52 q48.75 -26 97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 t97.5 0 V90 H0 Z" fill="#8fc2ff"/></svg>

<div style="position:absolute;inset:0;padding:64px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">

<div class="rise" style="display:flex;align-items:center;justify-content:space-between">
<div>
<div style="font-size:12px;font-weight:600;letter-spacing:.14em;color:#bff6f0">RIVER ATLAS</div>
<h1 style="margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.25)">Follow the water</h1>
</div>
<button class="glass" aria-label="Search" style="width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
</button>
</div>

<div class="glass rise" style="border-radius:32px;padding:20px 22px 22px;height:214px;box-sizing:border-box;animation-delay:.1s">
<div style="display:flex;align-items:center;gap:8px">
<span style="padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600">Africa</span>
<span style="font-size:12px;color:#d6f7f3">Longest in this list</span>
</div>
<svg style="position:absolute;left:0;top:70px" width="346" height="110" viewBox="0 0 346 110" aria-hidden="true">
<defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".6" stop-color="#9ff5ec"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
<path d="M-10 70 C 50 10, 100 120, 170 62 S 270 10, 330 58" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="14" stroke-linecap="round"/>
<path d="M-10 70 C 50 10, 100 120, 170 62 S 270 10, 330 58" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round"/>
<path class="flow" d="M-10 70 C 50 10, 100 120, 170 62 S 270 10, 330 58" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<circle class="ripple" cx="330" cy="58" r="10" stroke-width="1.5"/><circle class="ripple r2" cx="330" cy="58" r="10" stroke-width="1.5"/>
<circle cx="330" cy="58" r="5" fill="#fff"/>
</svg>
<div style="position:absolute;left:22px;bottom:18px;right:22px;display:flex;align-items:flex-end;justify-content:space-between">
<div>
<div style="font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1">Nile</div>
<div style="font-size:13px;color:#d6f7f3;margin-top:4px">Sudan · Egypt</div>
</div>
<div style="text-align:right"><div style="font-size:26px;font-weight:700;letter-spacing:-.02em">6,650</div><div style="font-size:12px;color:#d6f7f3">kilometres</div></div>
</div>
</div>

<div class="glass rise" style="border-radius:999px;padding:4px;display:flex;animation-delay:.2s">
<button style="flex:1;height:38px;border:0;border-radius:999px;background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);font-weight:600;font-size:14px;cursor:pointer">Length</button>
<button style="flex:1;height:38px;border:0;border-radius:999px;background:transparent;font-weight:500;font-size:14px;cursor:pointer;color:#e6fbf8">Land area</button>
<button style="flex:1;height:38px;border:0;border-radius:999px;background:transparent;font-weight:500;font-size:14px;cursor:pointer;color:#e6fbf8">Inflation</button>
</div>

<div style="display:flex;flex-direction:column;gap:10px">

<div class="glass rise" style="border-radius:24px;padding:14px 18px;animation-delay:.3s">
<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:17px;font-weight:600">Amazon</b><span style="font-size:15px;font-weight:600">6,400 km</span></div>
<div style="font-size:12px;color:#d6f7f3;margin:2px 0 8px">Brazil · Peru</div>
<div class="bar"><i style="width:96%"></i></div>
</div>

<div class="glass rise" style="border-radius:24px;padding:14px 18px;animation-delay:.4s">
<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:17px;font-weight:600">Yangtze</b><span style="font-size:15px;font-weight:600">6,300 km</span></div>
<div style="font-size:12px;color:#d6f7f3;margin:2px 0 8px">China</div>
<div class="bar"><i style="width:95%;animation-delay:.1s"></i></div>
</div>

<div class="glass rise" style="border-radius:24px;padding:14px 18px;animation-delay:.5s">
<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:17px;font-weight:600">Missouri–Mississippi</b><span style="font-size:15px;font-weight:600">6,275 km</span></div>
<div style="font-size:12px;color:#d6f7f3;margin:2px 0 8px">United States</div>
<div class="bar"><i style="width:94%;animation-delay:.2s"></i></div>
</div>

</div>
</div>

<nav class="glass floaty" aria-label="Main" style="position:absolute;left:50%;margin-left:-143px;bottom:26px;width:286px;height:66px;border-radius:999px;display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;padding:0 10px">
<button aria-label="Globe" style="width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
<button aria-label="Rivers" style="width:48px;height:48px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8c3-3 6 3 9 0s6-3 9 0M3 14c3-3 6 3 9 0s6-3 9 0M3 20c3-3 6 3 9 0s6-3 9 0"/></svg></button>
<button aria-label="Saved" style="width:48px;height:48px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
